<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#1c4a86">Unity Visual Scripting: Level 1 Movement and Escape Cleanup</text>
  <text x="500" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#888888" font-style="italic">Enemy prefab's Script Graph - the node-for-node equivalent of the Level 1 code</text>

  <rect x="350" y="92" width="300" height="60" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">UPDATE</text>
  <text x="500" y="141" text-anchor="middle" font-family="Arial" font-size="11" fill="#cfe0f4">(event node - runs every frame)</text>

  <path d="M500,152 L500,182" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,182) rotate(90)"/>

  <!-- TRANSLATE node -->
  <rect x="230" y="184" width="540" height="86" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="230" y="184" width="540" height="34" rx="8" fill="#16305c"/>
  <text x="500" y="207" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">TRANSLATE</text>
  <polygon points="230,226 220,232 230,238" fill="#16305c"/>
  <polygon points="770,226 780,232 770,238" fill="#16305c"/>

  <text x="250" y="242" font-family="Arial" font-size="13" font-weight="bold" fill="#16305c">Translation:</text>
  <text x="350" y="242" font-family="Consolas, monospace" font-size="12.5" fill="#333333">Vector3.down * enemySpeed * deltaTime</text>
  <text x="250" y="260" font-family="Arial" font-size="12" fill="#555555" font-style="italic">Space: World</text>

  <path d="M500,270 L500,300" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,300) rotate(90)"/>

  <!-- BRANCH node -->
  <rect x="290" y="302" width="420" height="90" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="290" y="302" width="420" height="34" rx="8" fill="#16305c"/>
  <text x="500" y="325" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">BRANCH</text>
  <polygon points="290,344 280,350 290,356" fill="#16305c"/>
  <text x="365" y="370" text-anchor="end" font-family="Arial" font-size="13" font-weight="bold" fill="#16305c">Condition:</text>
  <text x="375" y="370" font-family="Consolas, monospace" font-size="12.5" fill="#333333">transform.position.y &lt; -6f</text>

  <path d="M375,392 L280,392 L280,356" fill="none" stroke="none"/>

  <path d="M400,392 L400,420" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(400,420) rotate(90)"/>
  <text x="416" y="412" font-family="Arial" font-size="13" fill="#555555" font-style="italic">True</text>

  <rect x="270" y="422" width="260" height="60" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="400" y="448" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">DESTROY</text>
  <text x="400" y="467" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#cfe0f4">Target: self</text>

  <path d="M400,482 L400,510" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(400,510) rotate(90)"/>
  <circle cx="400" cy="526" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="400" cy="526" r="7" fill="#16305c"/>
  <text x="422" y="531" text-anchor="start" font-family="Arial" font-size="13" fill="#555555" font-style="italic">end (escaped - no GameManager call)</text>

  <text x="500" y="592" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">Compare this graph to Bullet.cs's OnTriggerEnter2D in the Key: only that separate event graph ever calls</text>
  <text x="500" y="614" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">GameManager.RegisterKill() - the Enemy prefab's own Update graph above never references it at all.</text>

  <text x="500" y="660" text-anchor="middle" font-family="Arial" font-size="13" fill="#a97e1f" font-style="italic" font-weight="bold">GameManager already existed before this lesson - Unity was the one engine already using a dedicated manager object.</text>
</svg>
