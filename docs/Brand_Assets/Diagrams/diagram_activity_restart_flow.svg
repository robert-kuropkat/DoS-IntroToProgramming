<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010">
<rect width="1000" height="1010" fill="#ffffff"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#1c4a86">The Round Ends - Then It Starts Fresh</text>
<text x="500" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#888888" font-style="italic">The same shape in every engine, whatever the exact code or blocks look like</text>
<circle cx="500" cy="96" r="12" fill="#16305c"/>
<path d="M500,108 L500,134" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,136) rotate(90)"/>
<rect x="240" y="138" width="520" height="64" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
<text x="500" y="160" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">WIN OR LOSE REACHED</text>
<text x="500" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">enemies_remaining reaches 0, or lives reaches 0</text>
<path d="M500,202 L500,228" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,230) rotate(90)"/>
<rect x="240" y="232" width="520" height="64" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
<text x="500" y="254" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">game_active = false</text>
<text x="500" y="271" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#cfe0f4" font-style="italic">set on the manager object, at the same moment the win/lose message appears</text>
<path d="M500,296 L500,322" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,324) rotate(90)"/>
<rect x="240" y="326" width="520" height="64" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
<text x="500" y="348" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">THE FREEZE</text>
<text x="500" y="366" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#cfe0f4">every enemy checks game_active first - not active, do nothing</text>
<path d="M500,390 L500,416" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,418) rotate(90)"/>
<polygon points="500,420 650,465 500,510 350,465" fill="#e8c25a" stroke="#a97e1f" stroke-width="2.5"/>
<text x="500" y="463" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#3a2d0a">Is R pressed?</text>
<path d="M650,465 L720,465" fill="none" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(730,465) rotate(0)"/>
<text x="690" y="452" text-anchor="middle" font-family="Arial" font-size="12" fill="#555555" font-style="italic">No</text>
<rect x="735" y="440" width="230" height="56" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
<text x="850" y="462" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">KEEP WAITING</text>
<text x="850" y="479" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#cfe0f4" font-style="italic">frozen until R is pressed</text>
<path d="M500,510 L500,538" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,540) rotate(90)"/>
<text x="520" y="532" text-anchor="start" font-family="Arial" font-size="12" fill="#555555" font-style="italic">Yes</text>
<polygon points="500,542 670,592 500,642 330,592" fill="#e8c25a" stroke="#a97e1f" stroke-width="2.5"/>
<text x="500" y="590" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#3a2d0a">game_active</text>
<text x="500" y="607" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3a2d0a">== false ?</text>
<path d="M670,592 L720,592" fill="none" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(730,592) rotate(0)"/>
<text x="690" y="579" text-anchor="middle" font-family="Arial" font-size="12" fill="#555555" font-style="italic">No</text>
<rect x="735" y="564" width="230" height="56" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
<text x="850" y="586" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">IGNORED</text>
<text x="850" y="603" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#cfe0f4" font-style="italic">R mid-game does nothing</text>
<path d="M500,642 L500,674" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,676) rotate(90)"/>
<text x="520" y="664" text-anchor="start" font-family="Arial" font-size="12" fill="#555555" font-style="italic">Yes - round is over</text>
<rect x="190" y="678" width="620" height="120" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
<text x="500" y="700" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">start_game  (the ONE reset routine)</text>
<text x="500" y="718" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">1. clear every existing enemy</text>
<text x="500" y="736" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">2. score = 0, lives = 3, enemies_remaining = 5</text>
<text x="500" y="754" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">3. game_active = true, hide Win/Lose messages</text>
<text x="500" y="772" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">4. spawn a fresh set of enemies</text>
<path d="M500,798 L500,826" stroke="#16305c" stroke-width="4"/><path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,828) rotate(90)"/>
<circle cx="500" cy="846" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/><circle cx="500" cy="846" r="7" fill="#16305c"/>
<text x="522" y="851" text-anchor="start" font-family="Arial" font-size="12" fill="#555555" font-style="italic">back to normal play - identical to a brand-new game</text>
<text x="500" y="910" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">start_game also runs once at launch - one setup routine, two doorways in.</text>
<text x="500" y="932" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">Nothing about the setup logic was rewritten for restarting.</text>
<text x="500" y="972" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#a97e1f" font-style="italic">VIDEO GAME CREATION</text></svg>