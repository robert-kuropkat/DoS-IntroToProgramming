<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" width="1300" height="1000">
  <!-- Arrowheads are manually-rotated triangles (see diagram_game_loop.svg for why:
       this renderer doesn't compute SVG marker orient="auto" correctly on curves). -->
  <rect x="0" y="0" width="1300" height="1000" fill="#ffffff"/>

  <text x="650" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#1c4a86">Full GML Visual Sequence: obj_spawner's Create Event</text>
  <text x="650" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#888888" font-style="italic">every block in the Complete Level 3 solution, wired in the order it actually runs</text>

  <!-- Block: Set Variable enemy_count = 0 -->
  <rect x="280" y="90" width="360" height="60" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="460" y="115" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">SET VARIABLE</text>
  <text x="460" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">enemy_count = 0</text>

  <path d="M460,150 L460,180" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(460,180) rotate(90)"/>

  <!-- REPEAT container -->
  <rect x="90" y="184" width="1120" height="520" rx="16" fill="none" stroke="#16305c" stroke-width="2.5" stroke-dasharray="9,6"/>
  <rect x="112" y="170" width="230" height="34" rx="8" fill="#16305c"/>
  <text x="227" y="193" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">REPEAT - Times: 5</text>

  <!-- Create Instance block (compact) -->
  <rect x="190" y="226" width="540" height="86" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="460" y="248" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">INSTANCE - CREATE INSTANCE</text>
  <text x="420" y="263" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#cfe0f4">Object: obj_enemy   Layer: "Instances"</text>
  <text x="420" y="277" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#cfe0f4">X: 80+(enemy_count*96)   Y: 80</text>
  <text x="430" y="298" text-anchor="end" font-family="Arial" font-size="12.5" fill="#cfe0f4">Target:</text>
  <rect x="440" y="286" width="120" height="22" rx="6" fill="#f6e6b8" stroke="#c9a227" stroke-width="1.5"/>
  <text x="500" y="301" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#7a5a10">new_enemy</text>

  <path d="M460,312 L460,338" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(460,338) rotate(90)"/>

  <!-- Apply To block -->
  <rect x="190" y="340" width="540" height="72" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="460" y="365" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">INSTANCE - APPLY TO</text>
  <text x="360" y="392" text-anchor="end" font-family="Arial" font-size="12.5" fill="#cfe0f4">Action Scope -&gt; Expression:</text>
  <rect x="370" y="380" width="110" height="24" rx="6" fill="#f6e6b8" stroke="#c9a227" stroke-width="1.5"/>
  <text x="425" y="397" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#7a5a10">new_enemy</text>

  <!-- main flow continues straight down past the nested scope -->
  <path d="M460,412 L460,614" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(460,614) rotate(90)"/>
  <text x="476" y="510" font-family="Arial" font-size="12.5" fill="#888888" font-style="italic">continues below once the nested scope (right) finishes</text>

  <!-- Nested frame (drawn before the connector/annotation so its fill never paints over them) -->
  <rect x="760" y="300" width="380" height="320" rx="14" fill="#fbfbfb" stroke="#16305c" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="780" y="286" width="300" height="30" rx="8" fill="#16305c"/>
  <text x="930" y="306" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#f4f0e6">NESTED INSIDE APPLY TO'S SCOPE</text>

  <!-- rightward nesting connector -->
  <path d="M730,376 L756,376" stroke="#16305c" stroke-width="3.5"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(756,376) rotate(0)"/>
  <text x="628" y="415" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#555555" font-style="italic">attached to the RIGHT of</text>
  <text x="628" y="431" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#555555" font-style="italic">Apply To - a nested scope</text>

  <!-- If Expression -->
  <rect x="790" y="330" width="320" height="62" rx="8" fill="#16305c" stroke="#0f2c52" stroke-width="2"/>
  <text x="950" y="352" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">IF EXPRESSION</text>
  <text x="950" y="374" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">enemy_count mod 2 = 0</text>

  <text x="808" y="416" font-family="Arial" font-size="12.5" fill="#555555" font-style="italic">True (even):</text>
  <rect x="790" y="422" width="320" height="72" rx="8" fill="#16305c" stroke="#0f2c52" stroke-width="2"/>
  <text x="950" y="444" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#f4f0e6">SET INSTANCE COLOUR</text>
  <text x="950" y="463" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">Colour: make_color_rgb(200,25,55)</text>
  <text x="950" y="482" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#e8c25a">deep crimson red - Use Alpha: false</text>

  <text x="808" y="512" font-family="Arial" font-size="12.5" fill="#555555" font-style="italic">Else (odd):</text>
  <rect x="790" y="518" width="320" height="72" rx="8" fill="#16305c" stroke="#0f2c52" stroke-width="2"/>
  <text x="950" y="540" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#f4f0e6">SET INSTANCE COLOUR</text>
  <text x="950" y="559" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#cfe0f4">Colour: make_color_rgb(230,100,130)</text>
  <text x="950" y="578" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#e8c25a">lighter dusty rose/pink - Use Alpha: false</text>

  <path d="M950,392 L950,420" stroke="#16305c" stroke-width="3"/>
  <path d="M0,0 L-9,-3.5 L-9,3.5 Z" fill="#16305c" transform="translate(950,420) rotate(90)"/>

  <!-- Set Variable enemy_count = enemy_count + 1 -->
  <rect x="250" y="616" width="420" height="60" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="460" y="641" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">SET VARIABLE</text>
  <text x="460" y="662" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">enemy_count = enemy_count + 1</text>

  <!-- loop-back arrow, routed outside the Repeat container and the nested frame on the right -->
  <path d="M670,646 Q1250,646 1250,271 Q1250,271 742,271" fill="none" stroke="#c99a2e" stroke-width="3" stroke-dasharray="2,7"/>
  <path d="M0,0 L-11,-4.5 L-11,4.5 Z" fill="#c99a2e" transform="translate(742,271) rotate(180)"/>
  <text x="1272" y="460" font-family="Arial" font-size="13" fill="#888888" font-style="italic" transform="rotate(90 1272 460)">back to the top of Repeat, 5 times total</text>

  <!-- exit from Repeat -->
  <path d="M460,704 L460,738" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(460,738) rotate(90)"/>

  <rect x="250" y="740" width="420" height="80" rx="12" fill="#16305c" stroke="#0f2c52" stroke-width="3"/>
  <text x="460" y="772" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">ALL 5 ENEMIES EXIST</text>
  <text x="460" y="794" text-anchor="middle" font-family="Arial" font-size="13" fill="#cfe0f4">alternating crimson red and dusty rose</text>

  <path d="M460,820 L460,850" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(460,850) rotate(90)"/>
  <circle cx="460" cy="866" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="460" cy="866" r="7" fill="#16305c"/>
  <text x="482" y="871" text-anchor="start" font-family="Arial" font-size="13" fill="#555555" font-style="italic">end</text>

  <text x="650" y="920" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">This is the block-for-block equivalent of the Complete Level 3 solution's code above - same five ideas,</text>
  <text x="650" y="942" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">wired together instead of typed: Set Variable, Repeat, Create Instance, Apply To, If Expression, and Set Instance Colour.</text>
</svg>
