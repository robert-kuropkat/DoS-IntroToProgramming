<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"><rect width="1000" height="520" fill="#fff"/><text x="500" y="34" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="#1c4587">A Godot Signal: Four Pieces, Four Places</text><text x="500" y="58" text-anchor="middle" font-family="Arial" font-style="italic" font-size="13" fill="#888">Steps 1-3 are setup; step 4 is what actually makes things happen while the game runs</text><rect x="40" y="90" width="420" height="110" rx="12" fill="#16305a"/><text x="250.0" y="118" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="15" fill="#fff">1. CREATE the signal - in the Enemy script</text><text x="250.0" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">signal escaped</text><rect x="540" y="90" width="420" height="110" rx="12" fill="#16305a"/><text x="750.0" y="118" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="15" fill="#fff">2. CONNECT it - in Main, when each enemy is spawned</text><text x="750.0" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">new_enemy.escaped.connect(</text><text x="750.0" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">    $GameManager.on_enemy_escaped)</text><rect x="40" y="270" width="420" height="110" rx="12" fill="#16305a"/><text x="250.0" y="298" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="15" fill="#fff">3. WRITE the function - in the GameManager script</text><text x="250.0" y="326" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">func on_enemy_escaped():</text><text x="250.0" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">    lives -= 1</text><rect x="540" y="270" width="420" height="110" rx="12" fill="#a77b00"/><text x="750.0" y="298" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="15" fill="#fff">4. EMIT the signal - in the Enemy script, when it escapes</text><text x="750.0" y="326" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#cfe0f4">escaped.emit()</text><line x1="460" y1="145" x2="528" y2="145" stroke="#16305a" stroke-width="3"/><polygon points="540,145 526,138 526,152" fill="#16305a"/><line x1="750" y1="200" x2="750" y2="258" stroke="#16305a" stroke-width="3"/><polygon points="750,270 743,256 757,256" fill="#16305a"/><line x1="540" y1="325" x2="472" y2="325" stroke="#a77b00" stroke-width="3" stroke-dasharray="8 5"/><polygon points="460,325 474,318 474,332" fill="#a77b00"/><text x="500" y="312" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#a77b00">runs it</text><rect x="40" y="410" width="920" height="80" rx="10" fill="#f6f1e1" stroke="#c9a227"/><text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1c4587">Think of it like a doorbell</text><text x="500" y="464" text-anchor="middle" font-family="Arial" font-size="13" fill="#444">Steps 1-3 install the bell and wire it to the right room. Step 4 is someone pressing the button - and only then does the wired-up function run.</text><text x="500" y="508" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#a77b00">VIDEO GAME CREATION</text></svg>