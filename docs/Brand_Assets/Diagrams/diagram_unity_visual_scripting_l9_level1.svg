<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" width="1000" height="920">
  <rect x="0" y="0" width="1000" height="920" fill="#ffffff"/>

  <text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#1c4a86">Unity Visual Scripting: Level 1 Score and Continuous HUD</text>
  <text x="500" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#888888" font-style="italic">HUD GameObject's graph and the Bullet graph's kill-handling nodes</text>

  <text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="13" fill="#a97e1f" font-style="italic" font-weight="bold">HUD GameObject's graph - polls every frame, the same pattern as the code path's Update()</text>

  <rect x="330" y="106" width="340" height="60" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="500" y="131" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">UPDATE</text>
  <text x="500" y="151" text-anchor="middle" font-family="Arial" font-size="11" fill="#cfe0f4" font-style="italic">event node - fires every frame</text>

  <path d="M500,166 L380,194" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(372,198) rotate(27)"/>
  <path d="M500,166 L620,194" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(628,198) rotate(153)"/>

  <!-- Format String ScoreText -->
  <rect x="100" y="200" width="380" height="80" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="100" y="200" width="380" height="34" rx="8" fill="#16305c"/>
  <text x="290" y="223" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#f4f0e6">FORMAT STRING</text>
  <text x="130" y="258" font-family="Arial" font-size="11" fill="#888888" font-style="italic">(String category)</text>
  <text x="290" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#333333">"Score: {0}"  arg0 = Score</text>

  <path d="M290,280 L290,308" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(290,308) rotate(90)"/>

  <rect x="110" y="310" width="360" height="70" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="110" y="310" width="360" height="34" rx="8" fill="#16305c"/>
  <text x="290" y="333" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">SET TEXT</text>
  <text x="290" y="368" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#333333">Target: ScoreText</text>

  <!-- Format String LivesText -->
  <rect x="520" y="200" width="380" height="80" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="520" y="200" width="380" height="34" rx="8" fill="#16305c"/>
  <text x="710" y="223" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#f4f0e6">FORMAT STRING</text>
  <text x="550" y="258" font-family="Arial" font-size="11" fill="#888888" font-style="italic">(String category)</text>
  <text x="710" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#333333">"Lives: {0}"  arg0 = Lives</text>

  <path d="M710,280 L710,308" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(710,308) rotate(90)"/>

  <rect x="530" y="310" width="360" height="70" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="530" y="310" width="360" height="34" rx="8" fill="#16305c"/>
  <text x="710" y="333" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">SET TEXT</text>
  <text x="710" y="368" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#333333">Target: LivesText</text>

  <circle cx="500" cy="420" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="500" cy="420" r="7" fill="#16305c"/>
  <text x="522" y="425" text-anchor="start" font-family="Arial" font-size="13" fill="#555555" font-style="italic">end (HUD text updated, every frame, no matter what)</text>

  <text x="500" y="474" text-anchor="middle" font-family="Arial" font-size="13" fill="#a97e1f" font-style="italic" font-weight="bold">- - - Bullet graph's existing kill-handling nodes - the same place EnemiesRemaining already decrements - - -</text>

  <!-- ADD node -->
  <rect x="230" y="486" width="540" height="80" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="230" y="486" width="540" height="34" rx="8" fill="#16305c"/>
  <text x="500" y="509" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">ADD</text>
  <text x="270" y="544" font-family="Arial" font-size="12" fill="#888888" font-style="italic">(Math/Scalar category)</text>
  <text x="500" y="544" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#333333">Score + 10</text>

  <path d="M500,566 L500,594" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,594) rotate(90)"/>

  <!-- SET VARIABLE node -->
  <rect x="270" y="596" width="460" height="70" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="270" y="596" width="460" height="34" rx="8" fill="#16305c"/>
  <text x="500" y="619" text-anchor="middle" font-family="Arial" font-size="14.5" font-weight="bold" fill="#f4f0e6">SET VARIABLE</text>
  <text x="500" y="654" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#333333">Target: Score (graph variable)</text>

  <path d="M500,666 L500,694" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,694) rotate(90)"/>
  <circle cx="500" cy="710" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="500" cy="710" r="7" fill="#16305c"/>
  <text x="522" y="715" text-anchor="start" font-family="Arial" font-size="13" fill="#555555" font-style="italic">end (the existing EnemiesRemaining decrement runs alongside this)</text>

  <text x="500" y="770" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">The HUD graph never changes Score or Lives itself - it only ever reads them, every frame.</text>
  <text x="500" y="792" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">Only the Bullet graph's kill-handling nodes are allowed to change Score, the same separation as the code path.</text>

  <text x="500" y="880" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#a97e1f" font-style="italic">VIDEO GAME CREATION</text>
</svg>
