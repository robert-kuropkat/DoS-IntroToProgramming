<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#1c4a86">State Diagram: The Enemy</text>
  <text x="500" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#888888" font-style="italic">one active state, and two different terminal states depending on what actually happened</text>

  <!-- initial state marker -->
  <circle cx="620" cy="118" r="11" fill="#16305c" stroke="#c9a227" stroke-width="2"/>
  <path d="M615,126 Q560,145 545,168" fill="none" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(545,168) rotate(65)"/>
  <text x="640" y="112" text-anchor="start" font-family="Arial" font-size="13" fill="#555555" font-style="italic">start</text>

  <!-- Moving state (self-loop) -->
  <rect x="390" y="170" width="220" height="110" rx="55" fill="#16305c" stroke="#0f2c52" stroke-width="3"/>
  <text x="500" y="232" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#f4f0e6">Moving</text>
  <text x="500" y="256" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#cfe0f4" font-style="italic">y += enemy_speed each frame</text>

  <path d="M 455,172 C 430,140 490,120 500,152" fill="none" stroke="#999999" stroke-width="2.5" stroke-dasharray="3,6"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#999999" transform="translate(500,152) rotate(80)"/>
  <text x="465" y="118" text-anchor="middle" font-family="Arial" font-size="12" fill="#888888" font-style="italic">still on screen, still frame-ticking</text>

  <!-- Moving -> Destroyed (right) -->
  <path d="M 610,240 Q 750,270 800,340" fill="none" stroke="#c99a2e" stroke-width="4"/>
  <path d="M0,0 L-11,-4.5 L-11,4.5 Z" fill="#c99a2e" transform="translate(800,340) rotate(60)"/>
  <text x="740" y="255" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#16305c">hit by bullet</text>

  <!-- Moving -> Escaped (left) -->
  <path d="M 390,240 Q 250,270 200,340" fill="none" stroke="#999999" stroke-width="3" stroke-dasharray="2,7"/>
  <path d="M0,0 L-11,-4.5 L-11,4.5 Z" fill="#999999" transform="translate(200,340) rotate(120)"/>
  <text x="260" y="255" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#666666">passed bottom of screen</text>

  <!-- Destroyed terminal -->
  <rect x="690" y="342" width="220" height="90" rx="45" fill="#16305c" stroke="#0f2c52" stroke-width="3"/>
  <text x="800" y="392" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#f4f0e6">Destroyed (hit)</text>
  <path d="M800,432 L800,462" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(800,462) rotate(90)"/>
  <circle cx="800" cy="478" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="800" cy="478" r="7" fill="#16305c"/>
  <text x="800" y="505" text-anchor="middle" font-family="Arial" font-size="13" fill="#555555" font-style="italic">counts toward the win condition</text>

  <!-- Escaped terminal -->
  <rect x="90" y="342" width="220" height="90" rx="45" fill="#16305c" stroke="#0f2c52" stroke-width="3"/>
  <text x="200" y="392" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#f4f0e6">Escaped</text>
  <path d="M200,432 L200,462" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(200,462) rotate(90)"/>
  <circle cx="200" cy="478" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="200" cy="478" r="7" fill="#16305c"/>
  <text x="200" y="505" text-anchor="middle" font-family="Arial" font-size="13" fill="#555555" font-style="italic">must NOT count toward the win condition</text>

  <text x="500" y="558" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">Once an enemy leaves Moving, it never comes back - both destinations are final. The whole trick this lesson</text>
  <text x="500" y="580" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">teaches is making sure your code can tell these two final states apart, since only one of them is a kill.</text>
</svg>
