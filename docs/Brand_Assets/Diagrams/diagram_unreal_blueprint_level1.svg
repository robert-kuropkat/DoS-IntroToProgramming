<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760">
  <!-- Arrowheads are manually-rotated triangles (see diagram_game_loop.svg for why). -->
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" fill="#1c4a86">Unreal Blueprint: Level 1 Spawn Loop</text>
  <text x="500" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#888888" font-style="italic">Level Blueprint's Event Graph - the node-for-node equivalent of the Level 1 code</text>

  <rect x="350" y="92" width="300" height="60" rx="10" fill="#16305c" stroke="#0f2c52" stroke-width="2.5"/>
  <text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">EVENT BEGINPLAY</text>
  <text x="500" y="141" text-anchor="middle" font-family="Arial" font-size="11" fill="#cfe0f4">(event node)</text>

  <path d="M500,152 L500,182" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,182) rotate(90)"/>

  <rect x="110" y="180" width="780" height="290" rx="16" fill="none" stroke="#16305c" stroke-width="2.5" stroke-dasharray="9,6"/>
  <rect x="132" y="172" width="400" height="34" rx="8" fill="#16305c"/>
  <text x="332" y="195" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">FOR LOOP - First 0, Last 4, Loop Body</text>

  <!-- SPAWN ACTOR FROM CLASS node -->
  <rect x="230" y="222" width="540" height="100" rx="10" fill="#ffffff" stroke="#16305c" stroke-width="2.5"/>
  <rect x="230" y="222" width="540" height="34" rx="8" fill="#16305c"/>
  <text x="500" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f4f0e6">SPAWN ACTOR FROM CLASS</text>
  <polygon points="230,264 220,270 230,276" fill="#16305c"/>
  <polygon points="770,264 780,270 770,276" fill="#16305c"/>

  <text x="250" y="278" font-family="Arial" font-size="13" font-weight="bold" fill="#16305c">Class:</text>
  <text x="315" y="278" font-family="Consolas, monospace" font-size="13" fill="#333333">BP_Enemy</text>
  <text x="415" y="278" font-family="Arial" font-size="11.5" fill="#555555" font-style="italic">Transform.Location: from Index</text>

  <text x="475" y="313" text-anchor="end" font-family="Arial" font-size="13" font-weight="bold" fill="#16305c">Return Value (out):</text>
  <rect x="485" y="296" width="150" height="24" rx="6" fill="#f6e6b8" stroke="#c9a227" stroke-width="1.5"/>
  <text x="560" y="313" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#7a5a10">spawned Actor</text>
  <circle cx="770" cy="308" r="7" fill="#e8c25a" stroke="#a97e1f" stroke-width="2"/>

  <path d="M500,322 L500,348" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,348) rotate(90)"/>

  <text x="500" y="366" text-anchor="middle" font-family="Arial" font-size="12" fill="#555555" font-style="italic">(exec pin loops back automatically for each Index - no manual increment node needed)</text>

  <path d="M500,470 L500,506" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,506) rotate(90)"/>

  <rect x="290" y="508" width="420" height="80" rx="12" fill="#16305c" stroke="#0f2c52" stroke-width="3"/>
  <text x="500" y="540" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f4f0e6">5 ENEMIES NOW EXIST</text>
  <text x="500" y="562" text-anchor="middle" font-family="Arial" font-size="13" fill="#cfe0f4">positioned in a row, each independent</text>

  <path d="M500,588 L500,618" stroke="#16305c" stroke-width="4"/>
  <path d="M0,0 L-10,-4 L-10,4 Z" fill="#16305c" transform="translate(500,618) rotate(90)"/>
  <circle cx="500" cy="634" r="14" fill="#ffffff" stroke="#16305c" stroke-width="3"/>
  <circle cx="500" cy="634" r="7" fill="#16305c"/>
  <text x="522" y="639" text-anchor="start" font-family="Arial" font-size="13" fill="#555555" font-style="italic">end</text>

  <text x="500" y="694" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">Spawn Actor from Class's own Return Value pin already holds the exact Actor it just made - that pin is what</text>
  <text x="500" y="716" text-anchor="middle" font-family="Arial" font-size="15" fill="#555555" font-style="italic">Level 3's color logic wires into directly, no extra step required (see the Complete Visual Sequence diagram).</text>
</svg>
